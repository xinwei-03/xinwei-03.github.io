<style>
  /* 独立的照片区域 */
  header .personal-gallery {
    display: block;
    width: 100%;
    margin: 0 auto 20px;
    text-align: center;
  }

  /* 照片大小与居中 */
  header .personal-gallery .personal-photo-button {
    display: block;
    box-sizing: border-box;
    width: 240px;
    max-width: 100%;
    height: 300px;
    margin: 0 auto;
    padding: 0;
    border: none;
    border-radius: 12px;
    overflow: hidden;
    background: transparent;
    cursor: pointer;
  }

  /* 完整显示，不裁剪、不拉伸 */
  header .personal-gallery .personal-photo-button img {
    display: block !important;
    width: 100% !important;
    max-width: 100% !important;
    height: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
    border-radius: 0 !important;
    aspect-ratio: auto !important;
    object-fit: contain !important;
    object-position: center !important;
  }

  header .personal-photo-button:focus-visible {
    outline: 3px solid #267cb9;
    outline-offset: 4px;
  }

  header .personal-photo-caption {
    margin: 10px 0 0;
    text-align: center;
    font-size: 13px;
    line-height: 1.5;
    color: #777;
  }
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const header = document.querySelector("header");
  if (!header || header.querySelector(".personal-gallery")) return;

  const oldAvatar = header.querySelector(".image.avatar");
  const oldPhoto = header.querySelector("img");
  if (!oldPhoto) return;

  const photos = [
    "{{ '/photo1.jpg' | relative_url }}",
    "{{ '/photo2.jpg' | relative_url }}",
    "{{ '/photo3.jpg' | relative_url }}"
  ];

  let current = 0;

  const gallery = document.createElement("div");
  gallery.className = "personal-gallery";

  const button = document.createElement("button");
  button.type = "button";
  button.className = "personal-photo-button";
  button.setAttribute("aria-label", "切换到下一张个人照片");

  const photo = document.createElement("img");

  const caption = document.createElement("p");
  caption.className = "personal-photo-caption";
  caption.setAttribute("aria-live", "polite");

  button.appendChild(photo);
  gallery.appendChild(button);
  gallery.appendChild(caption);

  // 替换模板原有头像容器，避免旧样式干扰
  if (oldAvatar) {
    oldAvatar.replaceWith(gallery);
  } else {
    oldPhoto.replaceWith(gallery);
  }

  function showPhoto() {
    photo.src = photos[current];
    photo.alt = "王馨尉的个人照片，第" + (current + 1) + "张";
    caption.textContent =
      "点击照片切换 · " + (current + 1) + " / " + photos.length;
  }

  button.addEventListener("click", function () {
    current = (current + 1) % photos.length;
    showPhoto();
  });

  showPhoto();
});
</script>
