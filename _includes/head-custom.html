<style>
  .photo-switcher {
    display: block;
    width: 100%;
    max-width: 260px;
    padding: 0;
    border: none;
    border-radius: 12px;
    overflow: hidden;
    background: transparent;
    cursor: pointer;
  }

  .photo-switcher img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    object-position: center;
  }

  .photo-switcher:focus-visible {
    outline: 3px solid #267cb9;
    outline-offset: 4px;
  }

  .photo-hint {
    margin: 8px 0 16px;
    font-size: 13px;
    color: #777;
  }
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const photo = document.querySelector("header img");
  if (!photo) return;

  const photos = [
    "{{ '/photo1.jpg' | relative_url }}",
    "{{ '/photo2.jpg' | relative_url }}",
    "{{ '/photo3.jpg' | relative_url }}"
  ];

  let current = 0;

  const button = document.createElement("button");
  button.type = "button";
  button.className = "photo-switcher";
  button.setAttribute("aria-label", "切换到下一张个人照片");

  photo.parentNode.insertBefore(button, photo);
  button.appendChild(photo);

  const hint = document.createElement("p");
  hint.className = "photo-hint";
  hint.setAttribute("aria-live", "polite");
  button.insertAdjacentElement("afterend", hint);

  function showPhoto() {
    photo.src = photos[current];
    photo.alt = "王馨尉的个人照片，第" + (current + 1) + "张";
    hint.textContent =
      "点击照片切换 · " + (current + 1) + " / " + photos.length;
  }

  button.addEventListener("click", function () {
    current = (current + 1) % photos.length;
    showPhoto();
  });

  showPhoto();
});
</script>
<style>
  /* 让头像外层占满左侧栏，并取消圆形裁剪 */
  header .image.avatar {
    display: block;
    width: 100%;
    max-width: none;
    margin: 0 auto 16px;
    padding: 0;
    border-radius: 0;
    overflow: visible;
  }

  /* 放大照片按钮，并水平居中 */
  header .photo-switcher {
    display: block;
    width: 220px;
    max-width: 100%;
    margin: 0 auto;
    padding: 0;
    border: 0;
    border-radius: 12px;
    overflow: hidden;
  }

  /* 完整显示照片，保留原始比例 */
  header .photo-switcher img {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
    aspect-ratio: auto;
    margin: 0;
    border-radius: 0;
  }

  /* 切换提示也居中 */
  header .photo-hint {
    text-align: center;
    margin: 10px 0 16px;
  }
</style>
